<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人網頁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/></svg>');
            animation: float 20s infinite linear;
        }

        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(-100px); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid white;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        section {
            padding: 80px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #667eea;
        }

        .about {
            background: #f8f9fa;
        }

        .about-content {
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .skills {
            background: white;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .skill-card {
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            text-align: center;
            transition: transform 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .skill-card:hover {
            transform: translateY(-10px);
        }

        .skill-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .contact {
            background: #f8f9fa;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-links a {
            display: inline-block;
            width: 50px;
            height: 50px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.5rem;
            transition: transform 0.3s, background 0.3s;
        }

        .social-links a:hover {
            transform: scale(1.2);
            background: #764ba2;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .hero p {
                font-size: 1.2rem;
            }

            h2 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <div class="profile-img"></div>
            <h1>小明</h1>
            <p>網頁開發者 | 設計師 | 創作者</p>
            <a href="#about" class="btn">了解更多</a>
        </div>
    </div>

    <section id="about" class="about">
        <h2>關於我</h2>
        <div class="about-content">
            <p>你好！我是一位熱愛創作的開發者，專注於打造美觀且實用的網頁應用。</p>
            <p>我相信好的設計不僅要美觀，更要能夠解決實際問題，為使用者帶來價值。</p>
        </div>
    </section>

    <section id="skills" class="skills">
        <h2>我的專長</h2>
        <div class="skills-grid">
            <div class="skill-card">
                <h3>前端開發</h3>
                <p>HTML、CSS、JavaScript 及現代框架開發響應式網頁</p>
            </div>
            <div class="skill-card">
                <h3>UI/UX 設計</h3>
                <p>創造直觀且美觀的使用者介面與體驗</p>
            </div>
            <div class="skill-card">
                <h3>專案管理</h3>
                <p>有效規劃與執行專案，確保準時交付</p>
            </div>
        </div>
    </section>

    <section id="contact" class="contact">
        <h2>聯絡我</h2>
        <p>有任何問題或合作機會嗎？歡迎與我聯繫！</p>
        <div class="social-links">
            <a href="#" title="GitHub">G</a>
            <a href="#" title="LinkedIn">L</a>
            <a href="#" title="Email">@</a>
            <a href="#" title="Twitter">T</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 你的名字. 版權所有.</p>
    </footer>
</body>
</html>
