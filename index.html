<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Stack Master VR - Main Menu</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <!-- Material Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#eebd2b",
                        "background-light": "#f8f7f6",
                        "background-dark": "#221d10",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(34, 29, 16, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .text-shadow {
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden h-screen w-screen selection:bg-primary selection:text-background-dark">
    <!-- 3D Scene Background Simulation -->
    <div class="fixed inset-0 z-0">
        <!-- This image simulates the Three.js 3D background of falling bread -->
        <div class="absolute inset-0 bg-cover bg-center"
            data-alt="Abstract 3D rendering of golden floating bread loaves in a warm dark space"
            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBknBpcLw0LBvcQw-l_HzFKOu-GSMT9F92b5pGtWWpQsCzM3UEK6oTEfffjlDXZTUyp5GMj-rGkcj6EBdKcLQ9iCjN-qMuRPRx9BEimBFJZPnIm8jfq2Xo3w6TWuBz06786AxI9L8FqdvTPxUv1RrmxiQU_22_g2YmxB39gqKYCBqSOZEosL8xhR1Tg0-v1J-g5WfvqepHQRCb7wWOvOeVBbzu7CyE8PQMRan6F896ylFl1btgT_lGsEfSy2SFMbgbwCkjXOCxtPw");'>
        </div>
        <!-- Dark Overlay for Readability -->
        <div class="absolute inset-0 bg-[#181611]/80 bg-gradient-to-b from-black/60 via-[#181611]/70 to-black/90"></div>
    </div>
    <!-- Main Content Container -->
    <div class="relative z-10 flex flex-col h-full w-full max-w-7xl mx-auto px-6 py-6">
        <!-- Header / Status Bar -->

        <!-- Center Content Area (HUD) -->
        <main class="flex-1 flex flex-col items-center justify-center relative w-full">
            <div class="flex flex-col items-center gap-8 w-full max-w-md animate-in fade-in zoom-in duration-700">
                <!-- Game Title -->
                <div class="text-center mb-6">
                    <h1
                        class="text-5xl md:text-7xl font-black italic tracking-tighter text-white text-shadow leading-tight mb-2">
                        STACK <br />
                        <span class="text-primary drop-shadow-[0_0_15px_rgba(238,189,43,0.6)]">麵包疊疊樂</span>
                    </h1>

                </div>
                <!-- Primary Action -->
                <div class="w-full flex justify-center">
                    <button onclick="window.location.href='game_play_screen.html'"
                        class="group relative flex items-center justify-center w-full h-16 md:h-20 bg-primary hover:bg-[#ffcd38] text-background-dark rounded-full shadow-[0_0_40px_rgba(238,189,43,0.3)] hover:shadow-[0_0_60px_rgba(238,189,43,0.6)] transition-all duration-300 transform hover:scale-105 cursor-pointer">
                        <div
                            class="absolute inset-0 rounded-full bg-white/20 blur-md opacity-0 group-hover:opacity-100 transition-opacity">
                        </div>
                        <span
                            class="material-symbols-outlined mr-3 text-3xl md:text-4xl group-hover:rotate-12 transition-transform">play_arrow</span>
                        <span class="text-xl md:text-2xl font-black tracking-tight uppercase">Start Stacking</span>
                    </button>
                </div>
                <!-- Secondary Menu Stack -->
                <div class="w-full flex flex-col gap-4 mt-2">
                    <!-- High Scores -->
                    <button
                        class="glass-panel flex items-center justify-between w-full h-14 px-6 rounded-full hover:bg-white/10 transition-colors group cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div
                                class="size-8 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-primary group-hover:text-black transition-colors">
                                <span class="material-symbols-outlined text-lg">leaderboard</span>
                            </div>
                            <span class="font-bold text-lg tracking-wide">High Scores</span>
                        </div>
                        <span
                            class="material-symbols-outlined text-gray-500 group-hover:text-white transition-colors">chevron_right</span>
                    </button>
                    <!-- Settings -->
                    <button onclick="window.location.href='settings_screen.html'"
                        class="glass-panel flex items-center justify-between w-full h-14 px-6 rounded-full hover:bg-white/10 transition-colors group cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div
                                class="size-8 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-primary group-hover:text-black transition-colors">
                                <span class="material-symbols-outlined text-lg">settings</span>
                            </div>
                            <span class="font-bold text-lg tracking-wide">Settings</span>
                        </div>
                        <span
                            class="material-symbols-outlined text-gray-500 group-hover:text-white transition-colors">chevron_right</span>
                    </button>
                    <!-- How to Play -->

                </div>
            </div>
        </main>
        <!-- Footer / VR Toggle -->
        <footer class="w-full py-6 flex flex-col md:flex-row items-center justify-between relative z-20 gap-4">
            <div class="hidden md:block w-1/3">
                <p class="text-xs text-gray-500">v.1.0.4 - Alpha Build</p>
            </div>

            <div class="w-full md:w-1/3 flex justify-center md:justify-end gap-4 text-gray-400">

            </div>
        </footer>
    </div>
</body>

</html>
